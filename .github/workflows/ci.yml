name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel superseded runs on the same branch/PR so pushing a fix doesn't queue
# behind a run that's already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting first: cheapest check, and AGENTS.md's own per-PR gate
      # runs it before the others.
      - name: cargo fmt --check
        run: cargo fmt --check --all

      # --lib, not --all-targets: AGENTS.md holds measurement binaries and
      # test harnesses to a looser bar than the library code itself.
      #
      # AGENTS.md's own documented command uses `-W clippy::pedantic` (warn,
      # not deny) — appropriate for local dev, where a human reads the output,
      # but a `-W` flag never fails the exit code, so it can't gate a CI check
      # on its own. Escalated to `-D` here for both groups, matching what this
      # issue actually asks for ("fail the PR check, not just report") and
      # what AGENTS.md's own prose already claims as the bar ("must end at 0
      # warnings") — confirmed clean on current develop before adding this,
      # after fixing the one pre-existing pedantic warning nothing had caught.
      - name: cargo clippy
        run: cargo clippy --release --workspace --lib -- -D warnings -D clippy::pedantic

      - name: cargo test
        run: cargo test --release --workspace

  rfc-check:
    name: rfc.py check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docs` is a private submodule (metel-docs-internal), linked via SSH in
      # .gitmodules -- GitHub-hosted runners have no SSH key for it. Rewrite
      # the URL to HTTPS so DOCS_REPO_TOKEN (a fine-grained PAT scoped
      # read-only to metel-docs-internal alone -- it has no access to this
      # repo, and no write access to that one either) can authenticate the
      # clone. actions/checkout's own `token` input only covers the *main*
      # repo checkout, which already uses the workflow's built-in
      # GITHUB_TOKEN; a separate, differently-scoped credential is needed
      # for the submodule specifically, since it's a different, private repo.
      - name: point submodule fetch at HTTPS + the docs-only token
        run: git config --global url."https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: check out docs submodule
        run: git submodule update --init docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: rfc.py check
        run: python3 docs/public/rfcs/tools/rfc.py check

  doc-examples:
    name: doc examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same HTTPS-rewrite pattern as rfc-check, above, for the same reason:
      # `docs` is a private submodule and GitHub-hosted runners have no SSH
      # key provisioned for it.
      - name: point submodule fetch at HTTPS + the docs-only token
        run: git config --global url."https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: check out docs submodule
        run: git submodule update --init docs

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build metel
        run: cargo build --release -p metel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Checks README.md plus whatever commit the docs submodule is
      # currently pinned to -- not necessarily metel-docs-internal's latest
      # main. metel-docs-internal has its own copy of this workflow that
      # checks its own current main against the latest release binary, so a
      # broken example there is caught immediately rather than waiting for
      # this repo's submodule pointer to move.
      - name: check doc examples
        run: |
          python3 tools/check_doc_examples.py --binary target/release/metel \
            README.md \
            docs/public/getting-started/tutorials \
            docs/public/reference/spec
